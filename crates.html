<title>TDS Wiki — Crates</title>
<link rel="icon" type="image/png" href="https://static.wikia.nocookie.net/tower-defense-sim/images/5/56/MoltenBoss.png/revision/latest/scale-to-width-down/250?cb=20260205174302">
<style>
*{box-sizing:border-box}
:root{--panel:rgba(15,18,27,.92);--text:#fff;--muted:#b9c0cf;--border:rgba(255,255,255,.13);--accent:#65b8ff}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:linear-gradient(rgba(5,8,14,.64),rgba(5,8,14,.82)),url("https://static.wikia.nocookie.net/tower-defense-sim/images/9/95/SummerCastleIcon.png/revision/latest/smart/width/400/height/225?cb=20250709204530") center/cover fixed no-repeat}
body{overflow-x:hidden}
.top-banner{position:sticky;top:0;z-index:50;height:82px;display:flex;align-items:center;justify-content:center;gap:28px;padding:8px 24px;background:rgba(5,7,12,.95);border-bottom:2px solid rgba(255,255,255,.12);box-shadow:0 8px 30px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.top-banner img{width:min(650px,58vw);max-height:66px;object-fit:contain}
.banner-search{width:min(360px,32vw);flex-shrink:1}
#search{width:100%;padding:12px 15px;border:1px solid var(--border);border-radius:12px;outline:none;color:#fff;background:rgba(0,0,0,.5);font-size:14px}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(101,184,255,.14)}
.page{width:min(1500px,94vw);margin:14px auto 40px}
.hero{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px 20px;box-shadow:0 15px 45px rgba(0,0,0,.34)}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
.hero h1{margin:0;font-size:clamp(30px,4.2vw,50px)}
.hero p{margin:6px 0 0;color:var(--muted)}
.back{color:#fff;text-decoration:none;border:1px solid var(--border);background:rgba(0,0,0,.35);border-radius:10px;padding:9px 12px;font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px}
.filter{border:1px solid var(--border);color:#fff;background:rgba(0,0,0,.35);border-radius:999px;padding:7px 11px;cursor:pointer;font-size:12px}
.filter.active{border-color:var(--accent);background:rgba(101,184,255,.14)}
.crate-section{margin:18px 0 24px}
.section-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:9px;padding:0 3px}
.section-kicker{display:inline-block;color:var(--section-accent);font-size:25px;font-weight:900}
.section-heading p{margin:2px 0 0;color:var(--muted);font-size:12px}
.count{color:#c7cedb;font-size:11px;white-space:nowrap}
.crate-grid{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:10px}
.crate-card{flex:0 0 230px;width:230px;background:transparent;border:0;border-radius:0;overflow:hidden;box-shadow:none;transition:transform .18s ease,filter .18s ease}
.crate-card:hover{transform:translateY(-5px);filter:brightness(1.15)}
.crate-image{position:relative;width:230px;height:250px;overflow:hidden;background:rgba(15,18,27,.72) url("https://raw.githubusercontent.com/zacharyceiley-jpg/TDS-WIKI/main/assets/slot.png") center/100% 100% no-repeat}
.crate-image>img{display:block;width:100%;height:100%;padding:18px;object-fit:contain;background:transparent}
.crate-image:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.9));pointer-events:none}
.crate-name{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:11px 9px;text-align:center;font-size:15px;font-weight:900;text-shadow:0 2px 7px #000}
.crate-hover{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:5px;padding:14px;background:rgba(0,0,0,.93);opacity:0;transition:opacity .18s ease}
.crate-hover strong{font-size:16px}.crate-hover span{color:#c8cfda;font-size:11px}.crate-card:hover .crate-hover{opacity:1}
.crate-details{background:rgba(10,13,20,.96);border-top:1px solid var(--border)}
.crate-details summary{cursor:pointer;padding:9px 12px;font-size:12px;font-weight:800;list-style:none;text-align:center;color:#dbe3f0}.crate-details summary::-webkit-details-marker{display:none}.crate-details summary:before{content:"＋ ";color:#65b8ff}.crate-details[open] summary:before{content:"− "}
.crate-contents{padding:10px 10px 12px;border-top:1px solid rgba(255,255,255,.08)}
.contents-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;font-size:11px}.contents-head a{color:#65b8ff;text-decoration:none}
.contents-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.content-item{position:relative;display:flex;align-items:center;gap:6px;min-width:0;min-height:58px;padding:7px;border-radius:8px;background:rgba(15,18,27,.72) url("https://raw.githubusercontent.com/zacharyceiley-jpg/TDS-WIKI/main/assets/slot.png") center/100% 100% no-repeat;border:0;overflow:hidden;transition:transform .18s ease,filter .18s ease}.content-item:hover{transform:translateY(-2px);filter:brightness(1.15)}
.content-item img{width:34px;height:34px;border-radius:6px;object-fit:cover;background:#111;flex:none}.content-item strong{display:block;font-size:9px;line-height:1.05;text-shadow:0 1px 3px #000}.content-item span{display:block;color:#d0d7e3;font-size:8px;margin-top:2px;text-shadow:0 1px 3px #000}
.contents-note{color:#aeb7c7;font-size:10px;line-height:1.35}.contents-note a{display:block;margin-top:8px;color:#65b8ff;text-decoration:none}
.empty{display:none;padding:26px;background:var(--panel);border-radius:16px;text-align:center;color:var(--muted)}
footer{color:#aeb5c2;text-align:center;font-size:12px;margin-top:30px}
@media(max-width:700px){.top-banner{gap:10px;padding:8px 10px}.top-banner img{width:54vw}.banner-search{width:38vw}#search{font-size:12px;padding:10px}.hero-top{align-items:flex-start;flex-direction:column}.crate-card,.crate-image{width:180px}.crate-card{flex-basis:180px}.crate-image{height:195px}.crate-image>img{padding:14px}}

    "https://static.wikia.nocookie.net/tower-defense-sim/images/1/12/OICESledgerIcon.png/revision/latest?cb=20260311073112",

  Cowboy:
    "https://static.wikia.nocookie.net/tower-defense-sim/images/8/82/WDDefaultCowboyIcon.png/revision/latest?cb=20260311032013"
};


/* =========================================================
   HELPER FUNCTIONS
   ========================================================= */

function getCrateImage(crateName) {

  // First use the URL you manually entered.
  if (crateImages[crateName] && crateImages[crateName].trim() !== "") {
    return crateImages[crateName];
  }

  // If you have not entered an image yet, use a TDS Wiki
  // Special:FilePath fallback.
  const wikiName = crateName
    .replaceAll(" ", "_")
    .replaceAll("'", "");

  return `https://tds.wiki/wiki/Special:FilePath/${wikiName}.png`;
}


function getContentImage(towerName) {

  const key = towerName
    .replaceAll(" ", "");

  return contentImages[key] || contentImages.Scout;
}


function getWikiUrl(crateName) {

  return `https://tds.wiki/w/${encodeURIComponent(
    crateName.replaceAll(" ", "_")
  )}`;
}


/* =========================================================
   RENDER THE CRATES
   ========================================================= */

function renderCrates() {

  const root = document.getElementById("crateSections");

  root.innerHTML = "";

  Object.entries(crateData).forEach(([category, crates]) => {

    const section = document.createElement("section");

    section.className = "crate-section";
    section.dataset.category = category;

    section.innerHTML = `
      <div class="section-heading">

        <div>

          <div
            class="section-kicker"
            style="--section-accent:${categoryColors[category]}"
          >
            ${category}
          </div>

          <p>
            ${categoryDescriptions[category]}
          </p>

        </div>

        <span class="count">
          ${crates.length} crates
        </span>

      </div>

      <div class="crate-grid"></div>
    `;

    const grid = section.querySelector(".crate-grid");


    crates.forEach(crateName => {

      const card = document.createElement("article");

      card.className = "crate-card";

      card.dataset.name = crateName.toLowerCase();


      /* ---------- CONTENTS ---------- */

      const contents = crateContents[crateName] || [];


      let contentsHTML = "";


      if (contents.length > 0) {

        contentsHTML = `
          <div class="contents-grid">

            ${contents.map(([displayName, towerName]) => `

              <div class="content-item">

                <img
                  src="${getContentImage(towerName)}"
                  alt="${towerName}"
                >

                <div>

                  <strong>
                    ${displayName}
                  </strong>

                  <span>
                    ${towerName}
                  </span>

                </div>

              </div>

            `).join("")}

          </div>
        `;

      } else {

        contentsHTML = `
          <div class="contents-note">

            Contents have not been added yet.

            <a
              href="${getWikiUrl(crateName)}"
              target="_blank"
              rel="noopener"
            >
              Open crate article →
            </a>

          </div>
        `;
      }


      /* ---------- CARD ---------- */

      card.innerHTML = `

        <div class="crate-image">

          <img
            src="${getCrateImage(crateName)}"
            alt="${crateName}"
            onerror="
              this.onerror=null;
              this.style.objectFit='contain';
              this.src='https://static.wikia.nocookie.net/tower-defense-sim/images/6/68/ViolentNightClean.png/revision/latest/scale-to-width-down/340?cb=20221227092433';
            "
          >

          <div class="crate-name">
            ${crateName}
          </div>

          <div class="crate-hover">

            <strong>
              ${crateName}
            </strong>

            <span>
              Expand below to view contents
            </span>

          </div>

        </div>


        <details class="crate-details">

          <summary>
            Expand
          </summary>

          <div class="crate-contents">

            <div class="contents-head">

              <strong>
                Contents
              </strong>

              <a
                href="${getWikiUrl(crateName)}"
                target="_blank"
                rel="noopener"
              >
                TDS Wiki ↗
              </a>

            </div>

            ${contentsHTML}

          </div>

        </details>

      `;


      grid.appendChild(card);

    });


    root.appendChild(section);

  });

}


/* =========================================================
   SEARCH + FILTERS
   ========================================================= */

const search = document.getElementById("search");

const filters = [
  ...document.querySelectorAll(".filter")
];

let activeFilter = "all";


function renderResults() {

  const query =
    search.value
      .toLowerCase()
      .trim();


  let totalVisible = 0;


  document
    .querySelectorAll(".crate-section")
    .forEach(section => {

      const category = section.dataset.category;

      const correctCategory =
        activeFilter === "all" ||
        activeFilter === category;


      let sectionVisible = 0;


      section
        .querySelectorAll(".crate-card")
        .forEach(card => {

          const matches =
            correctCategory &&
            card.dataset.name.includes(query);


          card.style.display =
            matches ? "block" : "none";


          if (matches) {
            totalVisible++;
            sectionVisible++;
          }

        });


      section.style.display =
        sectionVisible > 0
          ? "block"
          : "none";

    });


  let empty =
    document.getElementById("empty");


  if (!empty) {

    empty =
      document.createElement("div");

    empty.id = "empty";
    empty.className = "empty";

    empty.textContent =
      "No crates match your search.";

    document
      .querySelector("main")
      .insertBefore(
        empty,
        document.querySelector("footer")
      );

  }


  empty.style.display =
    totalVisible > 0
      ? "none"
      : "block";

}


/* =========================================================
   FILTER BUTTONS
   ========================================================= */

filters.forEach(button => {

  button.addEventListener("click", () => {

    activeFilter =
      button.dataset.filter;


    filters.forEach(other => {

      other.classList.toggle(
        "active",
        other === button
      );

    });


    renderResults();

  });

});


/* =========================================================
   SEARCH
   ========================================================= */

search.addEventListener(
  "input",
  renderResults
);


/* =========================================================
   START PAGE
   ========================================================= */

renderCrates();

renderResults();

</script>
