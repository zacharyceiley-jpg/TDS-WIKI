<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDS Wiki — Units</title>
  <style>
    * { box-sizing: border-box; }
    :root { --panel: rgba(15, 18, 27, .94); --muted: #b9c0cf; --border: rgba(255,255,255,.14); }
    html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; color: white; }
    body {
      background: linear-gradient(rgba(5,8,14,.68), rgba(5,8,14,.88)),
        url("https://static.wikia.nocookie.net/tower-defense-sim/images/9/95/SummerCastleIcon.png/revision/latest/smart/width/400/height/225?cb=20250709204530") center/cover fixed;
    }
    .top-banner { position: sticky; top: 0; z-index: 5; min-height: 82px; display: flex; align-items: center; justify-content: center; gap: 28px; padding: 8px 24px; background: rgba(5,7,12,.96); border-bottom: 2px solid var(--border); }
    .top-banner img { width: min(650px, 58vw); max-height: 66px; object-fit: contain; }
    #search { width: min(360px, 32vw); padding: 12px 15px; border: 1px solid var(--border); border-radius: 12px; outline: 0; color: white; background: rgba(0,0,0,.5); }
    .page { width: min(1500px, 94vw); margin: 14px auto 40px; }
    .hero { padding: 20px; border: 1px solid var(--border); border-radius: 20px; background: var(--panel); }
    .hero-top { display: flex; align-items: end; justify-content: space-between; gap: 18px; }
    h1 { margin: 0; font-size: clamp(30px, 4.2vw, 50px); }
    .hero p { margin: 6px 0 0; color: var(--muted); }
    .back, .filter { color: white; border: 1px solid var(--border); background: rgba(0,0,0,.35); border-radius: 10px; padding: 9px 12px; cursor: pointer; text-decoration: none; font-size: 13px; }
    .filters { display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0 18px; }
    .filter { border-radius: 999px; padding: 7px 11px; }
    .filter.active { border-color: #65b8ff; background: rgba(101,184,255,.16); }
    .unit-section { margin: 18px 0 24px; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 14px; margin-bottom: 9px; padding: 0 3px; }
    .section-kicker { color: var(--accent); font-size: 25px; font-weight: 900; }
    .section-heading p, .count { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .unit-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
    .unit-card { position: relative; flex: 0 0 230px; height: 250px; overflow: hidden; display: block; color: white; border: 0; border-radius: 14px; background: url("https://raw.githubusercontent.com/zacharyceiley-jpg/TDS-WIKI/main/assets/slot.png") center/100% 100% no-repeat; text-decoration: none; transition: transform .18s, box-shadow .18s; }
    .unit-card:hover { transform: translateY(-6px) scale(1.025); box-shadow: 0 18px 36px rgba(0,0,0,.5); }
    .unit-card img { position: absolute; inset: 14px 14px 43px; z-index: 0; width: calc(100% - 28px); height: calc(100% - 57px); display: block; object-fit: contain; background: transparent; }
    .unit-card::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(transparent 48%, rgba(0,0,0,.72)); }
    .unit-name { position: absolute; right: 0; bottom: 0; left: 0; z-index: 1; padding: 11px 9px; text-align: center; font-weight: 900; text-shadow: 0 2px 7px #000; }
    .unit-hover { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; background: rgba(0,0,0,.92); opacity: 0; transition: opacity .18s; }
    .unit-card:hover .unit-hover { opacity: 1; }
    .unit-hover span { color: #c8cfda; font-size: 11px; }
    .empty { display: none; padding: 26px; border-radius: 16px; text-align: center; color: var(--muted); background: var(--panel); }
    footer { margin-top: 30px; color: #aeb5c2; text-align: center; font-size: 12px; }
    @media (max-width: 700px) { .top-banner { gap: 10px; padding: 8px 10px; } .top-banner img { width: 54vw; } #search { width: 38vw; } .hero-top { align-items: flex-start; flex-direction: column; } .unit-card { flex-basis: 180px; height: 195px; } }
  </style>
</head>
<body>

    const colors = { Basic: "#65b8ff", Golden: "#ffd45a", Evolved: "#ff8c4d", Event: "#ff7dbb", Hardcore: "#b88cff", Unused: "#9da6b5" };
    const descriptions = { Basic: "Standard units used by TDS unit-based systems.", Golden: "Golden variants and golden unit forms.", Evolved: "Evolved unit forms and upgraded variants.", Event: "Units connected to seasonal and event content.", Hardcore: "Units connected to Hardcore content.", Unused: "Unused, legacy, or unavailable unit assets." };
    const filters = document.getElementById("filters");
    const sections = document.getElementById("unitSections");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    let activeFilter = "all";

    function createCard(name, image) {
      const card = document.createElement("a");
      card.className = "unit-card";
      card.href = "#";
      card.dataset.name = name.toLowerCase();
      card.innerHTML = `<img src="${image}" alt="${name}" loading="lazy"><div class="unit-name">${name}</div><div class="unit-hover"><strong>${name}</strong><span>Open unit page</span></div>`;
      return card;
    }

    Object.entries(units).forEach(([category, entries]) => {
      const button = document.createElement("button");
      button.className = "filter";
      button.dataset.filter = category;
      button.textContent = category;
      filters.appendChild(button);

      const section = document.createElement("section");
      section.className = "unit-section";
      section.dataset.category = category;
      section.innerHTML = `<div class="section-heading"><div><div class="section-kicker" style="--accent:${colors[category]}">${category}</div><p>${descriptions[category]}</p></div><span class="count">${entries.length} units</span></div><div class="unit-grid"></div>`;
      const grid = section.querySelector(".unit-grid");
      entries.forEach(([name, image]) => grid.appendChild(createCard(name, image)));
      sections.appendChild(section);
    });

    const allButton = document.createElement("button");
    allButton.className = "filter active";
    allButton.dataset.filter = "all";
    allButton.textContent = "All";
    filters.prepend(allButton);

    function render() {
      const query = search.value.toLowerCase().trim();
      let visible = 0;
      document.querySelectorAll(".unit-section").forEach(section => {
        const categoryMatches = activeFilter === "all" || section.dataset.category === activeFilter;
        let sectionVisible = 0;
        section.querySelectorAll(".unit-card").forEach(card => {
          const matches = categoryMatches && card.dataset.name.includes(query);
          card.style.display = matches ? "block" : "none";
          if (matches) { visible++; sectionVisible++; }
        });
        section.style.display = sectionVisible ? "block" : "none";
      });
      empty.style.display = visible ? "none" : "block";
    }

    filters.addEventListener("click", event => {
      const button = event.target.closest(".filter");
      if (!button) return;
      activeFilter = button.dataset.filter;
      filters.querySelectorAll(".filter").forEach(item => item.classList.toggle("active", item === button));
      render();
    });
    search.addEventListener("input", render);
    render();
  </script>
</body>
</html>
